[project]
name = "ai-lvl-mcp"
version = "0.2.0"
description = "ai-lvl knowledge layer MCP server for employees (login + ACL-scoped search)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "keyring>=24",
]

[project.urls]
Homepage = "https://github.com/IntelionCloud/ai-lvl-mcp"
Repository = "https://github.com/IntelionCloud/ai-lvl-mcp"

[project.scripts]
ai-lvl-mcp = "ai_lvl_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_lvl_mcp"]
